# Weekly dependency PRs for every ecosystem in the repo. Free on public repos.
# Angular packages move together, so they are grouped into one PR, and
# TypeScript rides in that same group (not dev-tooling) since @angular/build
# pins a narrow `typescript` peer range. That grouping only keeps them in the
# same PR, though — Dependabot still bumps each package to its own latest
# independently, so it can (and did, 2026-09-05) put an incompatible pair in
# one PR: Angular 22 (wants typescript ~6.0.x) alongside typescript 7.0.2. A
# major Angular/TypeScript bump also needs `ng update`'s schematics, not a
# blind npm version bump, so major versions are left for a human to do
# deliberately; Dependabot here only auto-proposes minor/patch, which stay
# peer-compatible within a major line.
#
# `vitest` is the same story one layer down and was missed the first time:
# @angular/build declares `vitest ^4.0.8` as a peer, and the test runner is
# Angular's builder, not vitest's CLI. The dev-tooling group duly proposed
# vitest ^5.0.0 on 2026-09-11 (PR #13), and that PR's `npm ci` failed in CI
# while succeeding locally — npm on the runner is stricter about the recorded
# peer conflict than npm 11 here. Proof it was vitest and not a flake: the
# moment this rule landed, Dependabot closed #13 and opened #15 with jsdom 30
# alone off the same base, which went green. Majors are ignored here too, so
# the group stops re-proposing it every week; lift this when Angular widens
# that peer range.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "@angular-builders/*", "typescript"]
      dev-tooling:
        dependency-type: development
        exclude-patterns: ["@angular/*", "@angular-devkit/*", "typescript"]
    ignore:
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-builders/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
  # Both images in backend/Dockerfile carry a Java version, and that version is
  # not theirs to choose: pom.xml pins <java.version>21</java.version> and all
  # three setup-java steps install 21. Dependabot does not read either, so it
  # proposed eclipse-temurin 21-jre → 25-jre (PR #1) and maven 3.9-temurin-21 →
  # 3-temurin-26 (PR #2), both open and unmergeable since 2026-09-05.
  #
  # The second is the dangerous one. The Dockerfile's build stage is what
  # actually compiles the jar that ships to Render, so taking it would have CI
  # verify a JDK 21 build while a JDK 26 build is what deploys — the toolchain
  # divergence would not show up until something broke in production.
  #
  # So majors are ignored here, as they are for Angular and TypeScript above and
  # for the same reason: the bump is a decision about the project, not about the
  # dependency. Moving to a newer LTS means pom.xml, both workflows' setup-java
  # steps and both image tags changing together, deliberately. Lift these two
  # rules as part of that, not before it.
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "maven"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

# Weekly dependency PRs for every ecosystem in the repo. Free on public repos.
# Angular packages move together, so they are grouped into one PR, and
# TypeScript rides in that same group (not dev-tooling) since @angular/build
# pins a narrow `typescript` peer range. That grouping only keeps them in the
# same PR, though — Dependabot still bumps each package to its own latest
# independently, so it can (and did, 2026-09-05) put an incompatible pair in
# one PR: Angular 22 (wants typescript ~6.0.x) alongside typescript 7.0.2. A
# major Angular/TypeScript bump also needs `ng update`'s schematics, not a
# blind npm version bump, so major versions are left for a human to do
# deliberately; Dependabot here only auto-proposes minor/patch, which stay
# peer-compatible within a major line.
#
# `vitest` is the same story one layer down and was missed the first time:
# @angular/build declares `vitest ^4.0.8` as a peer, and the test runner is
# Angular's builder, not vitest's CLI. The dev-tooling group duly proposed
# vitest ^5.0.0 on 2026-09-11 (PR #13) — a PR that could not have merged
# whatever CI said, because the builder is written against vitest 4's API.
# Majors are ignored here too, so the group stops re-proposing it every week;
# lift this when Angular widens that peer range.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "@angular-builders/*", "typescript"]
      dev-tooling:
        dependency-type: development
        exclude-patterns: ["@angular/*", "@angular-devkit/*", "typescript"]
    ignore:
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-builders/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

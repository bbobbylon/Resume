name: Deploy frontend to GitHub Pages

# Publishes the Angular build to GitHub Pages (free, no card, custom domain
# supported). Runs on every push to main that touches the frontend or the seed
# data, and on demand. One-time setup — see docs/DEPLOYMENT.md → "Go-live runbook":
#   1. Push the repo; this workflow tries to enable Pages itself (configure-pages
#      with enablement). If that is refused: Settings → Pages → Source: "GitHub Actions".
#   2. Optional repo variables (Settings → Secrets and variables → Actions → Variables):
#        API_BASE_URL     = the Render service URL, only if it differs from the
#                           placeholder in frontend/src/environments/environment.ts
#        PAGES_BASE_HREF  = "/" when serving from a custom domain
#                           ("/Resume/" — the default — on bbobbylon.github.io/Resume)
#        PAGES_CNAME      = your custom domain (e.g. bobbylon.dev), if any.
#
# How a deploy works: the backend is built and started on the runner, `ng build`
# prerenders every route against it (static HTML per page, hydrated in the
# browser) and `npm run snapshot` captures its data into public/data/*.json for
# the pages that are not prerendered. The live API is only layered on top, so
# the site is complete even while Render's free tier is asleep.
on:
  push:
    branches: [main]
    paths: ['frontend/**', 'backend/src/main/**', '.github/workflows/deploy-pages.yml', '.github/actions/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Start the backend (build-time data source)
        uses: ./.github/actions/start-backend
      - name: Snapshot the API data
        working-directory: frontend
        run: API_URL=http://localhost:8420 npm run snapshot
      - name: Point the build at the API
        working-directory: frontend
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          # Optional; without the variable the placeholder in environment.ts stands.
          if [ -n "$API_BASE_URL" ]; then
            sed -i "s#apiBaseUrl: '[^']*'#apiBaseUrl: '${API_BASE_URL%/}'#" src/environments/environment.ts
          fi
          grep -n apiBaseUrl src/environments/environment.ts
      - name: Build (prerenders every route, then writes sitemap.xml)
        working-directory: frontend
        env:
          BASE_HREF: ${{ vars.PAGES_BASE_HREF || '/Resume/' }}
        run: |
          npm run build -- --base-href "$BASE_HREF"
          # Fail loudly if the project pages were not prerendered (backend unreachable).
          node -e "const r = Object.keys(require('./dist/frontend/prerendered-routes.json').routes);
                   console.log('prerendered:', r.join(' '));
                   if (!r.some((p) => p.startsWith('/projects/'))) { console.error('no project pages were prerendered'); process.exit(1); }"
      - name: Stop the backend
        if: always()
        run: kill "$BACKEND_PID" 2>/dev/null || true
      - name: Site URL, SPA fallback, CNAME
        working-directory: frontend/dist/frontend/browser
        env:
          CNAME: ${{ vars.PAGES_CNAME }}
          BASE_HREF: ${{ vars.PAGES_BASE_HREF || '/Resume/' }}
        run: |
          # Every prerendered page (Open Graph tags), the JS bundle (per-page og:url),
          # robots.txt and sitemap.xml carry the placeholder origin https://bobbylon.dev;
          # stamp the real one in.
          if [ -n "$CNAME" ]; then SITE_URL="https://$CNAME"
          else SITE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io${BASE_HREF%/}"; fi
          echo "Site URL: $SITE_URL"
          find . \( -name '*.html' -o -name '*.js' -o -name 'robots.txt' -o -name 'sitemap.xml' \) \
            -exec sed -i "s#https://bobbylon\.dev#${SITE_URL}#g" {} +
          # GitHub Pages serves 404.html for unknown paths. The client-rendered shell
          # boots the app there, so deep links to non-prerendered pages and typos
          # land on the not-found page instead of GitHub's.
          cp index.csr.html 404.html
          if [ -n "$CNAME" ]; then echo "$CNAME" > CNAME; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/frontend/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

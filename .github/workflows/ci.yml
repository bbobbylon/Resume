name: CI

# Builds and tests both halves of WebsiteHub on every push and PR to main, and
# on demand (workflow_dispatch). Free for public repos. Deployment is a separate
# workflow (deploy-pages.yml) — CI never deploys anything.
#
# The frontend job starts the backend first, because `ng build` prerenders every
# route against it: a build that silently produced skeleton pages would still
# "pass" otherwise. It is the same composite action the deploy uses.
#
# Action versions are pinned to a major tag and kept current deliberately: every
# action here ran on the Node 20 runtime until 2026-09-12, which GitHub has
# deprecated and was force-running on Node 24 (a warning annotation on every run,
# green ones included). These majors are the Node 24 releases. Dependabot proposes
# the bumps; take them one workflow at a time and confirm the run's annotation
# count actually drops, since a deploy step that breaks here breaks the live site.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build and test backend
        working-directory: backend
        run: mvn -B verify
      - name: Build backend Docker image
        run: docker build -t websitehub-backend ./backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run unit tests
        working-directory: frontend
        run: npm test -- --watch=false
      - name: Start the backend (build-time data source)
        uses: ./.github/actions/start-backend
      - name: Build frontend (prerenders every route)
        working-directory: frontend
        run: |
          npm run build
          node -e "const r = Object.keys(require('./dist/frontend/prerendered-routes.json').routes);
                   console.log('prerendered:', r.join(' '));
                   if (!r.some((p) => p.startsWith('/projects/'))) { console.error('no project pages were prerendered'); process.exit(1); }"

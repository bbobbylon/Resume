# Render Blueprint for the API — a Docker web service on the free plan (no card).
# The live service (https://bobs-resume.onrender.com) was created by hand in the
# Render dashboard on 2026-09-04 with exactly these settings; this file documents
# them and recreates the service in a fresh workspace (New → Blueprint → this repo
# → Apply). Applying it next to the existing service would create a second one.
# The frontend is NOT here: .github/workflows/deploy-pages.yml publishes it to
# GitHub Pages. Full runbook: docs/DEPLOYMENT.md → "Go-live runbook".
#
# Free-plan behaviour: the service sleeps after 15 min idle and takes about a
# minute to wake. The site covers that with a build-time snapshot of the API data,
# so visitors never wait on it.
services:
  - type: web
    # The public URL derives from the name: https://bobs-resume.onrender.com — the
    # same URL frontend/src/environments/environment.ts is built with. If a rebuilt
    # service ends up with another name, set the repo variable API_BASE_URL to the
    # new URL instead of editing code (deploy-pages.yml substitutes it).
    name: bobs-resume
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: ALLOWED_ORIGIN
        # Comma-separated origins allowed to call /api/**: the GitHub Pages origin
        # now; append the custom domain (e.g. ,https://bobbylon.dev) when it exists.
        value: https://bbobbylon.github.io
      - key: JAVA_TOOL_OPTIONS
        # Tuned for a 512 MB container that wakes often and serves little:
        # C1-only JIT starts faster, SerialGC has the smallest footprint.
        value: -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -XX:MaxRAMPercentage=70
